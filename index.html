<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{color-scheme:dark;--glass:rgba(18,29,48,.88);--line:rgba(255,255,255,.13);--blue:#60a5fa;--muted:#aab8ca}*{box-sizing:border-box}body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;color:#f4f7fb;background:#07111f;overflow:hidden}button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:#ffffff0c;border-radius:8px;padding:8px 12px}button:hover{background:#ffffff20}.wall{position:fixed;inset:0;background:radial-gradient(ellipse at 78% 22%,#245c9a 0,transparent 35%),radial-gradient(ellipse at 20% 80%,#163b66 0,transparent 38%),linear-gradient(135deg,#07111f,#101e36 55%,#07111f)}.orb{position:absolute;width:min(48vw,560px);aspect-ratio:1;border:1px solid #ffffff17;border-radius:50%;right:12%;top:10%;box-shadow:inset 0 0 90px #4ea5ff16,0 0 100px #4ea5ff12}.orb:before,.orb:after{content:"";position:absolute;inset:12%;border:1px solid #ffffff18;border-radius:50%;transform:rotateX(65deg) rotateY(25deg)}.orb:after{inset:25%;transform:rotateY(65deg) rotateX(20deg)}.desktop{position:relative;height:calc(100dvh - 58px);padding:20px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:12px}.shortcut{width:82px;min-height:88px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 3px;border:1px solid transparent;background:transparent;text-align:center;font-size:12px;text-shadow:0 1px 4px #000}.shortcut:hover,.shortcut:focus{background:#ffffff18;border-color:#ffffff22}.glyph{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:linear-gradient(145deg,#ffffff28,#ffffff0b);border:1px solid #ffffff22;box-shadow:0 6px 18px #0003}.note{position:absolute;right:24px;bottom:22px;max-width:290px;color:#d6e5f8;font-size:12px;text-align:right;text-shadow:0 1px 5px #000}.taskbar{position:fixed;bottom:0;left:0;right:0;height:58px;display:flex;align-items:center;justify-content:center;gap:8px;background:#101a2bd9;border-top:1px solid #ffffff18;backdrop-filter:blur(24px);z-index:20}.taskbar button{height:42px;min-width:42px;font-size:18px}.taskbar .search{width:min(240px,28vw);font-size:13px;text-align:left;color:#c6d3e4}.tray{position:absolute;right:16px;display:flex;align-items:center;gap:14px;font-size:12px;text-align:right;color:#e3ebf6}.start{display:none;position:fixed;z-index:30;bottom:68px;left:50%;transform:translateX(-50%);width:min(560px,calc(100vw - 24px));padding:20px;background:var(--glass);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(28px);box-shadow:0 20px 70px #0008}.start.show{display:block}.starthead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.apps button{display:flex;flex-direction:column;align-items:center;gap:7px;min-height:78px;border:0;background:transparent}.apps .glyph{width:38px;height:38px}.window{display:none;position:fixed;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100vw - 24px));height:min(520px,calc(100dvh - 100px));background:#101b2ceF;border:1px solid #ffffff2c;border-radius:13px;box-shadow:0 28px 90px #0009;overflow:hidden;backdrop-filter:blur(24px)}.window.show{display:flex;flex-direction:column}.window.minimized{display:none}.titlebar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line);background:#ffffff08;cursor:move;user-select:none;touch-action:none}.window-actions{display:flex;gap:6px}.window-actions button{min-width:34px;padding:3px 8px}.titlebar strong{font-weight:600}.winbody{padding:18px;overflow:auto;flex:1}.close{border:0;font-size:18px;padding:4px 10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.tile{border:1px solid var(--line);background:#ffffff09;border-radius:10px;padding:14px}.tile .big{font-size:24px;margin-bottom:8px}.muted{color:var(--muted)}.filelist{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:16px}.file{padding:14px;border:1px solid var(--line);border-radius:9px;background:#ffffff08}.terminal{background:#050a12;border:1px solid #ffffff18;border-radius:9px;padding:14px;font:13px/1.7 ui-monospace,Consolas,monospace;min-height:250px;color:#b8f7cb;white-space:pre-wrap}.terminal input{width:75%;background:transparent;color:white;border:0;outline:0;font:inherit}.field{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#091321;color:white;margin:6px 0 12px}.status{display:inline-flex;gap:7px;align-items:center;color:#9de7b0;font-size:12px}.dot{width:7px;height:7px;background:#4ade80;border-radius:50%}a{color:#8fc5ff}@media(max-width:600px){.desktop{padding:10px;gap:4px}.shortcut{width:72px}.tray{right:8px;gap:7px}.taskbar{justify-content:flex-start;padding-left:10px}.taskbar .search{display:none}.apps{grid-template-columns:repeat(3,1fr)}.note{display:none}}
</style></head>
<body><div class="wall"><div class="orb"></div></div>
<main class="desktop" aria-label="Desktop">
<button class="shortcut" data-open="files"><span class="glyph">📁</span>File Explorer</button>
<button class="shortcut" data-open="terminal"><span class="glyph">⌘</span>Terminal</button>
<button class="shortcut" data-open="browser"><span class="glyph">🌐</span>Browser</button>
<button class="shortcut" data-open="settings"><span class="glyph">⚙️</span>Settings</button>
<button class="shortcut" data-open="about"><span class="glyph">☁️</span>Cloud PC Info</button>
<div class="note">GHAZAAL CLOUD PC<br><span class="muted">Your workspace. Anywhere.</span></div></main>
<section class="start" id="start"><div class="starthead"><strong>Good to see you 👋</strong><span class="muted">Pinned</span></div><div class="apps">
<button data-open="files"><span class="glyph">📁</span>Explorer</button><button data-open="terminal"><span class="glyph">⌘</span>Terminal</button><button data-open="browser"><span class="glyph">🌐</span>Browser</button><button data-open="settings"><span class="glyph">⚙️</span>Settings</button><button data-open="about"><span class="glyph">☁️</span>About</button><button data-open="github"><span class="glyph">🐙</span>GitHub</button>
</div><p class="muted" style="margin:18px 0 0;font-size:12px">This is a browser workspace prototype, not a hosted Windows operating system.</p></section>
<div class="taskbar"><button id="startBtn" title="Start">⊞</button><button class="search" id="searchBtn">⌕ &nbsp; Search apps and files</button><button data-open="files" title="Explorer">📁</button><button data-open="terminal" title="Terminal">⌘</button><button data-open="browser" title="Browser">🌐</button><div class="tray"><span>◖◗</span><span id="clock">--:--<br><span class="muted">---</span></span></div></div>
<section class="window" id="window"><div class="titlebar" id="titlebar"><strong id="winTitle">Window</strong><div class="window-actions"><button id="minBtn" aria-label="Minimize" title="Minimize">—</button><button class="close" id="closeBtn" aria-label="Close" title="Close">×</button></div></div><div class="winbody" id="winBody"></div></section>
<script>
const $=s=>document.querySelector(s),win=$('#window'),body=$('#winBody'),start=$('#start');
const content={
files:['File Explorer',`<div class="muted">Home　›　Ghazaal Workspace</div><div class="cards" style="margin-top:14px"><div class="tile"><b>Browser-local files</b><p class="muted">Saved on this device in this browser only.</p></div><div class="tile"><b id="fileCount">0 items</b><p class="muted">Create, rename, download or delete.</p></div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin:14px 0"><button id="newFolderBtn">＋ New folder</button><button id="newFileBtn">＋ New text file</button><button id="downloadAllBtn">↓ Export all</button><button id="clearFilesBtn">Clear workspace</button></div><div class="tile" style="margin:12px 0"><b>☁️ GitHub Private Cloud Storage</b><p class="muted" style="font-size:12px">Use a separate private GitHub repository. Your token stays in this browser tab session and is never written into your workspace backup.</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><input class="field" id="ghOwner" aria-label="GitHub username" value="Azad-Ahmad-Ghazaal" placeholder="GitHub username" style="flex:1;min-width:130px;margin:0"><input class="field" id="ghRepo" aria-label="Private repository name" value="Ghazaal-Cloud-Data" placeholder="Private repository" style="flex:1;min-width:130px;margin:0"></div><input class="field" id="ghToken" type="password" autocomplete="off" spellcheck="false" aria-label="Fine-grained GitHub token" placeholder="Fine-grained GitHub token (contents read/write)" style="margin-top:8px"><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="ghConnectBtn">Connect private repo</button><button id="ghUploadBtn">↑ Upload to cloud</button><button id="ghDownloadBtn">↓ Download from cloud</button><button id="ghDisconnectBtn">Disconnect</button></div><p class="muted" id="ghStatus" role="status" aria-live="polite" style="font-size:12px;margin-bottom:0">Not connected. Create a private repository and a fine-grained token with Contents: Read and write.</p><p style="font-size:12px;margin:8px 0 0"><a href="https://github.com/new?visibility=private" target="_blank" rel="noopener">Create private repository ↗</a> · <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Create fine-grained token ↗</a></p></div><div id="fileNotice" class="muted" role="status" aria-live="polite"></div><div id="fileList" class="filelist"></div>`],
terminal:['Terminal',`<div class="terminal" id="term">Ghazaal Cloud PC [Web Terminal Prototype]<br>Type <b>help</b> to see available demo commands.<br><br><span id="out">guest@ghazaal:~$ </span><input id="cmd" aria-label="Terminal command" autocomplete="off"></div>`],
browser:['Browser',`<h2 style="margin-top:0">Browse the web</h2><p class="muted">Open a website in a new browser tab.</p><form id="browseForm"><input class="field" id="webUrl" placeholder="https://example.com" value="https://github.com"><button>Open website ↗</button></form><p class="muted">This opens a normal browser tab; it is not a remote browser running in the cloud.</p>`],
settings:['Settings',`<h2 style="margin-top:0">Personalization</h2><div class="cards"><div class="tile"><div class="big">🌌</div><b>Midnight blue</b><p class="muted">Current desktop theme</p></div><div class="tile"><div class="big">🕒</div><b>Local time</b><p class="muted">Clock follows this device</p></div><div class="tile"><div class="big">🔒</div><b>Privacy</b><p class="muted">No login or cloud file storage is configured</p></div></div>`],
about:['About Ghazaal Cloud PC',`<div class="status"><span class="dot"></span> Interface running</div><h2>Ghazaal Cloud PC</h2><p class="muted">Version 0.1.0 · GitHub-hosted web prototype</p><div class="cards"><div class="tile"><div class="big">🖥️</div><b>Desktop shell</b><p class="muted">Responsive browser UI</p></div><div class="tile"><div class="big">⚙️</div><b>Windows runner</b><p class="muted">Temporary GitHub Actions CI runner, not a persistent desktop</p></div><div class="tile"><div class="big">📦</div><b>Storage</b><p class="muted">No persistent user storage yet</p></div></div><p>To make this a real Cloud PC, it would need a separately hosted, licensed Windows VM and secure remote-desktop gateway.</p>`],
github:['GitHub',`<h2 style="margin-top:0">Project repository</h2><p>Source code, automation and deployment live on GitHub.</p><a href="https://github.com/Azad-Ahmad-Ghazaal/Ghazaal-Cloud-PC" target="_blank" rel="noopener">Open Ghazaal-Cloud-PC ↗</a>`]
};
function openApp(key){start.classList.remove('show');win.classList.remove('minimized');const v=content[key]||content.about;$('#winTitle').textContent=v[0];body.innerHTML=v[1];win.classList.add('show');if(key==='terminal')setupTerminal();if(key==='files')setupFileExplorer();if(key==='browser')$('#browseForm').onsubmit=e=>{e.preventDefault();let u=$('#webUrl').value.trim();if(!/^https?:\/\//i.test(u))u='https://'+u;try{const x=new URL(u);if(!['http:','https:'].includes(x.protocol))throw 0;window.open(x.href,'_blank','noopener')}catch{alert('Enter a valid http or https address.')}}}
document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openApp(b.dataset.open)));
$('#startBtn').onclick=()=>start.classList.toggle('show');$('#searchBtn').onclick=()=>start.classList.toggle('show');$('#closeBtn').onclick=()=>{win.classList.remove('show','minimized')};$('#minBtn').onclick=()=>win.classList.add('minimized');
const titlebar=$('#titlebar');let drag=null;titlebar.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const r=win.getBoundingClientRect();drag={x:e.clientX-r.left,y:e.clientY-r.top};titlebar.setPointerCapture(e.pointerId);win.style.transform='none';win.style.left=r.left+'px';win.style.top=r.top+'px'});titlebar.addEventListener('pointermove',e=>{if(!drag)return;const x=Math.max(0,Math.min(innerWidth-win.offsetWidth,e.clientX-drag.x));const y=Math.max(0,Math.min(innerHeight-58-win.offsetHeight,e.clientY-drag.y));win.style.left=x+'px';win.style.top=y+'px'});const stopDrag=()=>{drag=null};titlebar.addEventListener('pointerup',stopDrag);titlebar.addEventListener('pointercancel',stopDrag);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){win.classList.remove('show');start.classList.remove('show')}});
function setupFileExplorer(){
 const storageKey='ghazaal-cloud-pc-files-v1',list=$('#fileList'),notice=$('#fileNotice');
 let items=[],currentFolder=null,showTrash=false,sortMode='name',searchTerm='';
 const say=m=>{notice.textContent=m};
 const load=()=>{try{const raw=localStorage.getItem(storageKey),data=raw?JSON.parse(raw):[];return Array.isArray(data)?data.filter(x=>x&&typeof x.id==='string'&&typeof x.name==='string'&&(x.type==='file'||x.type==='folder')).map(x=>({...x,parentId:x.parentId||null,deletedAt:x.deletedAt||null})):[]}catch{return []}};
 const save=()=>{try{localStorage.setItem(storageKey,JSON.stringify(items));return true}catch{say('Browser storage is full or unavailable. Export a backup and free some space.');return false}};
 const safeName=name=>{const n=name.trim().replace(/[\\\/:*?"<>|]/g,'-').slice(0,100);return n||''};
 const makeId=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9);
 const active=x=>showTrash?!!x.deletedAt:!x.deletedAt;
 const parentExists=id=>!id||items.some(x=>x.id===id&&x.type==='folder'&&!x.deletedAt);
 const uniqueName=(name,parent,exclude)=>!items.some(x=>x.id!==exclude&&x.parentId===parent&&!x.deletedAt&&x.name.toLowerCase()===name.toLowerCase());
 function render(){
  list.replaceChildren();
  const controls=document.createElement('div');controls.style.cssText='display:flex;gap:8px;flex-wrap:wrap;margin:12px 0';
  const search=document.createElement('input');search.className='field';search.placeholder='Search current folder…';search.value=searchTerm;search.style.cssText='flex:1;min-width:150px;margin:0';search.setAttribute('aria-label','Search files');search.addEventListener('input',()=>{searchTerm=search.value;render()});controls.append(search);
  const sort=document.createElement('select');sort.className='field';sort.style.cssText='width:auto;margin:0';sort.setAttribute('aria-label','Sort files');[['name','Name A–Z'],['newest','Newest first'],['oldest','Oldest first'],['type','Type']].forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;sort.append(o)});sort.value=sortMode;sort.addEventListener('change',()=>{sortMode=sort.value;render()});controls.append(sort);list.append(controls);
  const nav=document.createElement('div');nav.style.cssText='display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px';
  const home=document.createElement('button');home.textContent='Home';home.onclick=()=>{currentFolder=null;showTrash=false;searchTerm='';render()};nav.append(home);
  let folder=currentFolder?items.find(x=>x.id===currentFolder):null;
  if(currentFolder&&!folder){currentFolder=null;folder=null}
  if(folder){const crumb=document.createElement('span');crumb.className='muted';crumb.textContent='› '+folder.name;nav.append(crumb)}
  const trash=document.createElement('button');trash.textContent=showTrash?'← Back to files':'♲ Recycle Bin';trash.onclick=()=>{showTrash=!showTrash;currentFolder=null;searchTerm='';render()};nav.append(trash);list.append(nav);
  const visible=items.filter(x=>active(x)&&(showTrash||x.parentId===currentFolder)&&(!showTrash||true)&&x.name.toLowerCase().includes(searchTerm.toLowerCase()));
  visible.sort((a,b)=>sortMode==='newest'?String(b.created||'').localeCompare(String(a.created||'')):sortMode==='oldest'?String(a.created||'').localeCompare(String(b.created||'')):sortMode==='type'?a.type.localeCompare(b.type)||a.name.localeCompare(b.name):a.name.localeCompare(b.name));
  $('#fileCount').textContent=items.filter(x=>!x.deletedAt).length+' items · '+items.filter(x=>x.deletedAt).length+' in trash';
  if(!visible.length){const p=document.createElement('p');p.className='muted';p.textContent=showTrash?'Recycle Bin is empty.':'No items here. Create a folder or text file to get started.';list.append(p);return}
  for(const item of visible){
   const card=document.createElement('div');card.className='file';
   const name=document.createElement('div');name.style.cssText='font-weight:600;overflow-wrap:anywhere;margin-bottom:10px';name.textContent=(item.type==='folder'?'📁 ':'📝 ')+item.name;card.append(name);
   if(item.type==='file'&&!showTrash){const preview=document.createElement('div');preview.className='muted';preview.style.cssText='font-size:12px;overflow-wrap:anywhere;margin-bottom:10px';preview.textContent=(item.content||'').slice(0,90)||'Empty text file';card.append(preview)}
   const actions=document.createElement('div');actions.style.cssText='display:flex;gap:5px;flex-wrap:wrap';
   const button=(label,action)=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.style.cssText='padding:5px 8px;font-size:12px';b.addEventListener('click',action);actions.append(b)};
   if(showTrash){button('Restore',()=>restore(item));button('Delete forever',()=>purge(item))}
   else{if(item.type==='folder')button('Open',()=>{currentFolder=item.id;searchTerm='';render()});else{button('Open / Edit',()=>edit(item));button('Download',()=>download(item))}button('Rename',()=>rename(item));button('Move to trash',()=>trashItem(item))}
   card.append(actions);list.append(card);
  }
 }
 function create(type){const name=safeName(prompt(type==='folder'?'Folder name:':'Text file name (example: notes.txt):')||'');if(!name)return;if(!uniqueName(name,currentFolder))return say('An item with that name already exists here.');const item={id:makeId(),name,type,parentId:currentFolder,created:new Date().toISOString(),content:''};if(type==='file')item.content=prompt('Text file contents:')||'';items.push(item);if(save()){render();say((type==='folder'?'Folder':'File')+' created: '+name)}}
 function rename(item){const next=safeName(prompt('Enter a new name:',item.name)||'');if(!next||next===item.name)return;if(!uniqueName(next,item.parentId,item.id))return say('An item with that name already exists here.');item.name=next;if(save()){render();say('Renamed: '+next)}}
 function edit(item){const next=prompt('Edit text file contents:',item.content||'');if(next===null)return;item.content=next;item.updated=new Date().toISOString();if(save()){render();say('Saved: '+item.name)}}
 function trashItem(item){if(!confirm('Move "'+item.name+'" to Recycle Bin?'))return;const now=new Date().toISOString();const mark=x=>{if(x.id===item.id||isDescendant(x,item.id))x.deletedAt=now};items.forEach(mark);if(save()){render();say('Moved to Recycle Bin.')}}
 function isDescendant(x,parentId){let p=x.parentId;while(p){if(p===parentId)return true;const parent=items.find(y=>y.id===p);p=parent?parent.parentId:null}return false}
 function restore(item){const restoredName=item.name;items.forEach(x=>{if(x.id===item.id||isDescendant(x,item.id))x.deletedAt=null});if(!parentExists(item.parentId))item.parentId=null;if(!uniqueName(item.name,item.parentId,item.id))item.name=item.name+' (restored)';if(save()){render();say('Restored: '+restoredName)}}
 function purge(item){if(!confirm('Permanently delete "'+item.name+'" and its contents?'))return;items=items.filter(x=>x.id!==item.id&&!isDescendant(x,item.id));if(save()){render();say('Permanently deleted.')}}
 function download(item){const blob=new Blob([item.content||''],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=item.name.endsWith('.txt')?item.name:item.name+'.txt';document.body.append(a);a.click();a.remove();URL.revokeObjectURL(url);say('Download started: '+a.download)}
 $('#newFolderBtn').onclick=()=>create('folder');$('#newFileBtn').onclick=()=>create('file');
 $('#downloadAllBtn').onclick=()=>{const blob=new Blob([JSON.stringify({app:'Ghazaal Cloud PC',exportedAt:new Date().toISOString(),items},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='ghazaal-workspace-backup.json';document.body.append(a);a.click();a.remove();URL.revokeObjectURL(url);say('Workspace backup downloaded.')};
 $('#clearFilesBtn').onclick=()=>{if(!confirm('Permanently delete every workspace item, including Recycle Bin?'))return;items=[];if(save()){currentFolder=null;showTrash=false;render();say('Workspace cleared.')}};

 const ghOwner=$('#ghOwner'),ghRepo=$('#ghRepo'),ghToken=$('#ghToken'),ghStatus=$('#ghStatus');
 const ghConfigKey='ghcp-cloud-config-v1',ghTokenKey='ghcp-session-token-v1',ghPath='ghazaal-workspace.json';
 try{const cfg=JSON.parse(sessionStorage.getItem(ghConfigKey)||'{}');if(cfg.owner)ghOwner.value=cfg.owner;if(cfg.repo)ghRepo.value=cfg.repo}catch{}
 const cloudSay=m=>{ghStatus.textContent=m};
 const cloudConfig=()=>({owner:ghOwner.value.trim(),repo:ghRepo.value.trim()});
 const cloudToken=()=>sessionStorage.getItem(ghTokenKey)||'';
 const cloudHeaders=()=>({'Accept':'application/vnd.github+json','Authorization':'Bearer '+cloudToken(),'X-GitHub-Api-Version':'2022-11-28'});
 const cloudUrl=()=>{const c=cloudConfig();return 'https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)};
 async function cloudRequest(path,options={}){const response=await fetch(cloudUrl()+path,{...options,headers:{...cloudHeaders(),...(options.headers||{})}});let data={};try{data=await response.json()}catch{}if(!response.ok){const error=new Error(data.message||('GitHub request failed ('+response.status+')'));error.status=response.status;throw error}return data}
 function encodeCloudText(value){const bytes=new TextEncoder().encode(value);let binary='';for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(binary)}
 function decodeCloudText(value){const binary=atob(value.replace(/\s/g,''));const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
 function connected(){return !!cloudToken()}
 $('#ghConnectBtn').onclick=async()=>{const c=cloudConfig(),token=ghToken.value.trim();if(!c.owner||!c.repo||!token)return cloudSay('Enter GitHub username, private repository name and token.');if(!/^[A-Za-z0-9_.-]+$/.test(c.owner)||!/^[A-Za-z0-9_.-]+$/.test(c.repo))return cloudSay('Username or repository name contains invalid characters.');cloudSay('Checking private repository access…');try{const response=await fetch('https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo),{headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'}});const data=await response.json();if(!response.ok)throw new Error(data.message||'Could not access repository.');if(data.private!==true)throw new Error('For safety, this must be a PRIVATE repository.');sessionStorage.setItem(ghTokenKey,token);sessionStorage.setItem(ghConfigKey,JSON.stringify(c));ghToken.value='';cloudSay('Connected to private repository '+c.owner+'/'+c.repo+'. Token is held only for this tab session.');}catch(e){sessionStorage.removeItem(ghTokenKey);cloudSay('Connection failed: '+e.message)}};
 $('#ghUploadBtn').onclick=async()=>{if(!connected())return cloudSay('Connect your private repository first.');if(!confirm('Upload this browser workspace and replace the cloud backup file if it already exists?'))return;cloudSay('Uploading workspace to private GitHub repository…');try{let existing=null;try{existing=await cloudRequest('/contents/'+ghPath+'?ref=main')}catch(e){if(e.status!==404)throw e}const payload={message:'Update Ghazaal Cloud PC workspace backup',content:encodeCloudText(JSON.stringify({app:'Ghazaal Cloud PC',schemaVersion:1,exportedAt:new Date().toISOString(),items},null,2)),branch:'main'};if(existing?.sha)payload.sha=existing.sha;await cloudRequest('/contents/'+ghPath,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});cloudSay('Upload complete. Your workspace backup is now in the private repository.');}catch(e){cloudSay('Upload failed: '+e.message+'. Check token Contents: Read and write permission and repository access.')}};
 $('#ghDownloadBtn').onclick=async()=>{if(!connected())return cloudSay('Connect your private repository first.');if(!confirm('Replace the files in this browser with the latest cloud backup? Download/export a local backup first if needed.'))return;cloudSay('Downloading workspace from private GitHub repository…');try{const remote=await cloudRequest('/contents/'+ghPath+'?ref=main');if(remote.type!=='file'||!remote.content)throw new Error('Cloud backup file is missing or not a normal file.');const data=JSON.parse(decodeCloudText(remote.content));if(!data||!Array.isArray(data.items))throw new Error('Cloud backup format is invalid.');const imported=data.items.filter(x=>x&&typeof x.id==='string'&&typeof x.name==='string'&&(x.type==='file'||x.type==='folder')).map(x=>({id:x.id,name:safeName(x.name),type:x.type,parentId:x.parentId||null,created:x.created||new Date().toISOString(),content:typeof x.content==='string'?x.content:'',deletedAt:x.deletedAt||null}));if(imported.length!==data.items.length)throw new Error('Some backup entries are invalid; current workspace was not changed.');const ids=new Set(imported.map(x=>x.id));if(imported.some(x=>x.parentId&&!ids.has(x.parentId)))throw new Error('Backup has missing folder references; current workspace was not changed.');items=imported;if(!save())throw new Error('Could not save downloaded data in this browser.');currentFolder=null;showTrash=false;searchTerm='';render();cloudSay('Download complete. '+items.length+' items restored from private cloud backup.');}catch(e){cloudSay('Download failed: '+e.message)}};
 $('#ghDisconnectBtn').onclick=()=>{sessionStorage.removeItem(ghTokenKey);sessionStorage.removeItem(ghConfigKey);ghToken.value='';cloudSay('Disconnected. The token has been removed from this tab session.');};
 if(connected()){ghToken.value='';cloudSay('Session connection ready for '+cloudConfig().owner+'/'+cloudConfig().repo+'.')}
 items=load();render();
}
function setupTerminal(){const input=$('#cmd'),out=$('#out');input.focus();input.onkeydown=e=>{if(e.key!=='Enter')return;const c=input.value.trim();let msg='';switch(c.toLowerCase()){case'help':msg='Available demo commands: help, date, whoami, clear, about';break;case'date':msg=new Date().toString();break;case'whoami':msg='guest (browser demo)';break;case'about':msg='This is not a real OS terminal or remote shell.';break;case'clear':out.textContent='';input.value='';return;case'':break;default:msg='Command not found. Type help.'}out.textContent+='\n'+msg+'\nguest@ghazaal:~$ ';input.value='';}}
function tick(){const d=new Date();$('#clock').innerHTML=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'<br><span class="muted">'+d.toLocaleDateString([], {month:'short',day:'numeric'})+'</span>'}tick();setInterval(tick,1000);
</script></body></html>
