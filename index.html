<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><title>Ghazaal Cloud PC</title>
<style>
:root{color-scheme:dark;--glass:rgba(18,29,48,.88);--line:rgba(255,255,255,.13);--blue:#60a5fa;--muted:#aab8ca}*{box-sizing:border-box}body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;color:#f4f7fb;background:#07111f;overflow:hidden}button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:#ffffff0c;border-radius:8px;padding:8px 12px}button:hover{background:#ffffff20}.wall{position:fixed;inset:0;background:radial-gradient(ellipse at 78% 22%,#245c9a 0,transparent 35%),radial-gradient(ellipse at 20% 80%,#163b66 0,transparent 38%),linear-gradient(135deg,#07111f,#101e36 55%,#07111f)}.orb{position:absolute;width:min(48vw,560px);aspect-ratio:1;border:1px solid #ffffff17;border-radius:50%;right:12%;top:10%;box-shadow:inset 0 0 90px #4ea5ff16,0 0 100px #4ea5ff12}.orb:before,.orb:after{content:"";position:absolute;inset:12%;border:1px solid #ffffff18;border-radius:50%;transform:rotateX(65deg) rotateY(25deg)}.orb:after{inset:25%;transform:rotateY(65deg) rotateX(20deg)}.desktop{position:relative;height:calc(100dvh - 58px);padding:20px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:12px}.shortcut{width:82px;min-height:88px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 3px;border:1px solid transparent;background:transparent;text-align:center;font-size:12px;text-shadow:0 1px 4px #000}.shortcut:hover,.shortcut:focus{background:#ffffff18;border-color:#ffffff22}.glyph{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:linear-gradient(145deg,#ffffff28,#ffffff0b);border:1px solid #ffffff22;box-shadow:0 6px 18px #0003}.note{position:absolute;right:24px;bottom:22px;max-width:290px;color:#d6e5f8;font-size:12px;text-align:right;text-shadow:0 1px 5px #000}.taskbar{position:fixed;bottom:0;left:0;right:0;height:58px;display:flex;align-items:center;justify-content:center;gap:8px;background:#101a2bd9;border-top:1px solid #ffffff18;backdrop-filter:blur(24px);z-index:20}.taskbar button{height:42px;min-width:42px;font-size:18px}.taskbar .search{width:min(240px,28vw);font-size:13px;text-align:left;color:#c6d3e4}.tray{position:absolute;right:16px;display:flex;align-items:center;gap:14px;font-size:12px;text-align:right;color:#e3ebf6}.start{display:none;position:fixed;z-index:30;bottom:68px;left:50%;transform:translateX(-50%);width:min(560px,calc(100vw - 24px));padding:20px;background:var(--glass);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(28px);box-shadow:0 20px 70px #0008}.start.show{display:block}.starthead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.apps button{display:flex;flex-direction:column;align-items:center;gap:7px;min-height:78px;border:0;background:transparent}.apps .glyph{width:38px;height:38px}.window{display:none;position:fixed;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100vw - 24px));height:min(520px,calc(100dvh - 100px));background:#101b2ceF;border:1px solid #ffffff2c;border-radius:13px;box-shadow:0 28px 90px #0009;overflow:hidden;backdrop-filter:blur(24px)}.window.show{display:flex;flex-direction:column}.titlebar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line);background:#ffffff08}.titlebar strong{font-weight:600}.winbody{padding:18px;overflow:auto;flex:1}.close{border:0;font-size:18px;padding:4px 10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.tile{border:1px solid var(--line);background:#ffffff09;border-radius:10px;padding:14px}.tile .big{font-size:24px;margin-bottom:8px}.muted{color:var(--muted)}.filelist{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:16px}.file{padding:14px;border:1px solid var(--line);border-radius:9px;background:#ffffff08}.terminal{background:#050a12;border:1px solid #ffffff18;border-radius:9px;padding:14px;font:13px/1.7 ui-monospace,Consolas,monospace;min-height:250px;color:#b8f7cb;white-space:pre-wrap}.terminal input{width:75%;background:transparent;color:white;border:0;outline:0;font:inherit}.field{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#091321;color:white;margin:6px 0 12px}.status{display:inline-flex;gap:7px;align-items:center;color:#9de7b0;font-size:12px}.dot{width:7px;height:7px;background:#4ade80;border-radius:50%}a{color:#8fc5ff}@media(max-width:600px){.desktop{padding:10px;gap:4px}.shortcut{width:72px}.tray{right:8px;gap:7px}.taskbar{justify-content:flex-start;padding-left:10px}.taskbar .search{display:none}.apps{grid-template-columns:repeat(3,1fr)}.note{display:none}}
</style></head>
<body><div class="wall"><div class="orb"></div></div>
<main class="desktop" aria-label="Desktop">
<button class="shortcut" data-open="files"><span class="glyph">📁</span>File Explorer</button>
<button class="shortcut" data-open="terminal"><span class="glyph">⌘</span>Terminal</button>
<button class="shortcut" data-open="browser"><span class="glyph">🌐</span>Browser</button>
<button class="shortcut" data-open="settings"><span class="glyph">⚙️</span>Settings</button>
<button class="shortcut" data-open="about"><span class="glyph">☁️</span>Cloud PC Info</button>
<div class="note">GHAZAAL CLOUD PC<br><span class="muted">Your workspace. Anywhere.</span></div></main>
<section class="start" id="start"><div class="starthead"><strong>Good to see you 👋</strong><span class="muted">Pinned</span></div><div class="apps">
<button data-open="files"><span class="glyph">📁</span>Explorer</button><button data-open="terminal"><span class="glyph">⌘</span>Terminal</button><button data-open="browser"><span class="glyph">🌐</span>Browser</button><button data-open="settings"><span class="glyph">⚙️</span>Settings</button><button data-open="about"><span class="glyph">☁️</span>About</button><button data-open="github"><span class="glyph">🐙</span>GitHub</button>
</div><p class="muted" style="margin:18px 0 0;font-size:12px">This is a browser workspace prototype, not a hosted Windows operating system.</p></section>
<div class="taskbar"><button id="startBtn" title="Start">⊞</button><button class="search" id="searchBtn">⌕ &nbsp; Search apps and files</button><button data-open="files" title="Explorer">📁</button><button data-open="terminal" title="Terminal">⌘</button><button data-open="browser" title="Browser">🌐</button><div class="tray"><span>◖◗</span><span id="clock">--:--<br><span class="muted">---</span></span></div></div>
<section class="window" id="window"><div class="titlebar"><strong id="winTitle">Window</strong><button class="close" id="closeBtn" aria-label="Close">×</button></div><div class="winbody" id="winBody"></div></section>
<script>
const $=s=>document.querySelector(s),win=$('#window'),body=$('#winBody'),start=$('#start');
const content={
files:['File Explorer',`<div class="muted">Home　›　Ghazaal Workspace</div><div class="cards" style="margin-top:16px"><div class="tile"><div class="big">📌</div><b>Quick access</b><p class="muted">Your workspace shortcuts</p></div><div class="tile"><div class="big">☁️</div><b>Cloud files</b><p class="muted">Connect a real storage provider in a future version</p></div></div><div class="filelist"><div class="file">📁　Documents</div><div class="file">📁　Projects</div><div class="file">📁　Downloads</div><div class="file">📁　Pictures</div><div class="file">📝　Welcome.txt</div></div><p class="muted">Demo folders are visual placeholders. Files are not uploaded or stored by this page.</p>`],
terminal:['Terminal',`<div class="terminal" id="term">Ghazaal Cloud PC [Web Terminal Prototype]<br>Type <b>help</b> to see available demo commands.<br><br><span id="out">guest@ghazaal:~$ </span><input id="cmd" aria-label="Terminal command" autocomplete="off"></div>`],
browser:['Browser',`<h2 style="margin-top:0">Browse the web</h2><p class="muted">Open a website in a new browser tab.</p><form id="browseForm"><input class="field" id="webUrl" placeholder="https://example.com" value="https://github.com"><button>Open website ↗</button></form><p class="muted">This opens a normal browser tab; it is not a remote browser running in the cloud.</p>`],
settings:['Settings',`<h2 style="margin-top:0">Personalization</h2><div class="cards"><div class="tile"><div class="big">🌌</div><b>Midnight blue</b><p class="muted">Current desktop theme</p></div><div class="tile"><div class="big">🕒</div><b>Local time</b><p class="muted">Clock follows this device</p></div><div class="tile"><div class="big">🔒</div><b>Privacy</b><p class="muted">No login or cloud file storage is configured</p></div></div>`],
about:['About Ghazaal Cloud PC',`<div class="status"><span class="dot"></span> Interface running</div><h2>Ghazaal Cloud PC</h2><p class="muted">Version 0.1.0 · GitHub-hosted web prototype</p><div class="cards"><div class="tile"><div class="big">🖥️</div><b>Desktop shell</b><p class="muted">Responsive browser UI</p></div><div class="tile"><div class="big">⚙️</div><b>Windows runner</b><p class="muted">Temporary GitHub Actions CI runner, not a persistent desktop</p></div><div class="tile"><div class="big">📦</div><b>Storage</b><p class="muted">No persistent user storage yet</p></div></div><p>To make this a real Cloud PC, it would need a separately hosted, licensed Windows VM and secure remote-desktop gateway.</p>`],
github:['GitHub',`<h2 style="margin-top:0">Project repository</h2><p>Source code, automation and deployment live on GitHub.</p><a href="https://github.com/Azad-Ahmad-Ghazaal/Ghazaal-Cloud-PC" target="_blank" rel="noopener">Open Ghazaal-Cloud-PC ↗</a>`]
};
function openApp(key){start.classList.remove('show');const v=content[key]||content.about;$('#winTitle').textContent=v[0];body.innerHTML=v[1];win.classList.add('show');if(key==='terminal')setupTerminal();if(key==='browser')$('#browseForm').onsubmit=e=>{e.preventDefault();let u=$('#webUrl').value.trim();if(!/^https?:\/\//i.test(u))u='https://'+u;try{const x=new URL(u);if(!['http:','https:'].includes(x.protocol))throw 0;window.open(x.href,'_blank','noopener')}catch{alert('Enter a valid http or https address.')}}}
document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openApp(b.dataset.open)));
$('#startBtn').onclick=()=>start.classList.toggle('show');$('#searchBtn').onclick=()=>start.classList.toggle('show');$('#closeBtn').onclick=()=>win.classList.remove('show');
document.addEventListener('keydown',e=>{if(e.key==='Escape'){win.classList.remove('show');start.classList.remove('show')}});
function setupTerminal(){const input=$('#cmd'),out=$('#out');input.focus();input.onkeydown=e=>{if(e.key!=='Enter')return;const c=input.value.trim();let msg='';switch(c.toLowerCase()){case'help':msg='Available demo commands: help, date, whoami, clear, about';break;case'date':msg=new Date().toString();break;case'whoami':msg='guest (browser demo)';break;case'about':msg='This is not a real OS terminal or remote shell.';break;case'clear':out.textContent='';input.value='';return;case'':break;default:msg='Command not found. Type help.'}out.textContent+='\n'+msg+'\nguest@ghazaal:~$ ';input.value='';}}
function tick(){const d=new Date();$('#clock').innerHTML=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'<br><span class="muted">'+d.toLocaleDateString([], {month:'short',day:'numeric'})+'</span>'}tick();setInterval(tick,1000);
</script></body></html>
