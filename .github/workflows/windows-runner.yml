name: Windows 2025 Runner Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-2025-poc
  cancel-in-progress: true

jobs:
  validate-on-windows:
    name: Validate project on Windows Server 2025 runner
    runs-on: windows-2025
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Report Windows environment
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -ne "Windows") {
            throw "Expected a Windows GitHub-hosted runner."
          }

          $os = Get-CimInstance Win32_OperatingSystem
          $computer = Get-CimInstance Win32_ComputerSystem
          $cpu = (Get-CimInstance Win32_Processor | Measure-Object -Property NumberOfLogicalProcessors -Sum).Sum
          $disk = Get-Volume -DriveLetter C

          Write-Host "=== Ghazaal Cloud PC: Windows runner proof of concept ==="
          Write-Host "OS: $($os.Caption)"
          Write-Host "Version: $($os.Version)"
          Write-Host "Build: $($os.BuildNumber)"
          Write-Host "Architecture: $($os.OSArchitecture)"
          Write-Host "Logical processors: $cpu"
          Write-Host ("Installed RAM (GB): {0:N1}" -f ($computer.TotalPhysicalMemory / 1GB))
          Write-Host ("C: free space (GB): {0:N1}" -f ($disk.SizeRemaining / 1GB))
          Write-Host "Runner image: $env:ImageOS $env:ImageVersion"
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"

      - name: Check required project files
        shell: pwsh
        run: |
          $required = @(
            "index.html",
            "README.md",
            "setup/windows-setup.ps1"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file -PathType Leaf)) {
              throw "Missing required project file: $file"
            }
            Write-Host "Found: $file"
          }

          $html = Get-Content "index.html" -Raw
          if ($html -notmatch "Ghazaal Cloud PC") {
            throw "Expected desktop title was not found in index.html."
          }

          Write-Host "All project checks passed."

      - name: Test temporary file operations
        shell: pwsh
        run: |
          $testDirectory = Join-Path $env:RUNNER_TEMP "ghazaal-smoke-test"
          $testFile = Join-Path $testDirectory "runner-test.txt"
          $expected = "Ghazaal Cloud PC temporary storage test"

          New-Item -ItemType Directory -Force -Path $testDirectory | Out-Null
          Set-Content -Path $testFile -Value $expected -Encoding UTF8

          $actual = (Get-Content -Path $testFile -Raw).Trim()
          if ($actual -ne $expected) {
            throw "Temporary file read-back did not match."
          }

          Remove-Item -Path $testFile -Force
          if (Test-Path $testFile) {
            throw "Temporary test file was not removed."
          }

          Write-Host "PASS: temporary file create/read/delete operations."

      - name: Inventory development tools and browsers
        shell: pwsh
        run: |
          $tools = @("git", "python", "python3", "node", "npm", "dotnet", "winget", "choco", "scoop")
          foreach ($tool in $tools) {
            $command = Get-Command $tool -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($command) {
              Write-Host "AVAILABLE: $tool -> $($command.Source)"
              if ($tool -in @("git", "python", "python3", "node", "npm", "dotnet")) {
                & $command.Source --version 2>&1 | Select-Object -First 1
              }
            }
            else {
              Write-Host "NOT FOUND: $tool"
            }
          }

          $browsers = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Mozilla Firefox\firefox.exe"
          )

          foreach ($browser in $browsers) {
            if (Test-Path $browser) {
              Write-Host "BROWSER FOUND: $browser"
            }
          }

          Write-Host "Inventory only: no software was installed or modified."
